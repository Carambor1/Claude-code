<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="1200" height="1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="72%"><stop offset="0" stop-color="#6b4508"/><stop offset="0.55" stop-color="#1c1203"/><stop offset="1" stop-color="#000"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.18" stop-color="#ffd85a"/><stop offset="0.32" stop-color="#b8780f"/>
      <stop offset="0.5" stop-color="#ffe88a"/><stop offset="0.66" stop-color="#d69a22"/><stop offset="0.82" stop-color="#8a560a"/><stop offset="1" stop-color="#f5c74a"/></linearGradient>
    <linearGradient id="metal2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c4"/><stop offset="0.3" stop-color="#e8a92a"/><stop offset="0.55" stop-color="#fff0a0"/><stop offset="0.8" stop-color="#a86c0e"/><stop offset="1" stop-color="#ffd65c"/></linearGradient>
    <radialGradient id="orb" cx="36%" cy="28%" r="80%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.12" stop-color="#fff4b8"/><stop offset="0.4" stop-color="#ffc93a"/><stop offset="0.75" stop-color="#c2800f"/><stop offset="1" stop-color="#6e4306"/></radialGradient>
    <radialGradient id="glow" r="50%"><stop offset="0.25" stop-color="#ffe08a" stop-opacity="0.85"/><stop offset="0.6" stop-color="#ffb627" stop-opacity="0.25"/><stop offset="1" stop-color="#ffb627" stop-opacity="0"/></radialGradient>
    <radialGradient id="ray" r="50%"><stop offset="0" stop-color="#fff6cf" stop-opacity="0.55"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1a0f00" flood-opacity="0.8"/></filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shine" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/>
      <feSpecularLighting in="b" surfaceScale="5" specularConstant="1.1" specularExponent="28" lighting-color="#fff8dc" result="spec"><fePointLight x="180" y="80" z="260"/></feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="s2"/>
      <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3="0.9" k4="0"/>
    </filter>
    <g id="spark"><path d="M0 -22 L4 -4 L22 0 L4 4 L0 22 L-4 4 L-22 0 L-4 -4 Z" fill="#fffef2"/><circle r="4" fill="#fff"/></g>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <!-- god rays -->
  <g opacity="0.85">
    <path d="M300 305 L250 -60 L350 -60 Z M300 305 L660 230 L660 330 Z M300 305 L350 660 L250 660 Z M300 305 L-60 380 L-60 280 Z M300 305 L560 -40 L620 20 Z M300 305 L40 650 L-20 590 Z M300 305 L640 560 L590 620 Z M300 305 L-40 50 L10 -10 Z" fill="url(#ray)"/>
  </g>
  <circle cx="300" cy="305" r="300" fill="url(#glow)"/>
  <!-- bloom copy behind everything -->
  <g filter="url(#bloom)" opacity="0.9"><rect x="110" y="140" width="380" height="330" rx="20" fill="#ffcb45"/><circle cx="300" cy="305" r="150" fill="#fff0a0"/></g>
  <!-- golden plate -->
  <g filter="url(#shine)">
    <path d="M122 140 L470 140 L492 162 L492 440 L470 470 L132 470 L108 448 L108 154 Z" fill="url(#metal)" stroke="#7a4d08" stroke-width="5"/>
    <path d="M142 164 L456 164 L468 176 L468 430 L456 446 L146 446 L132 432 L132 178 Z" fill="none" stroke="#fff7d0" stroke-opacity="0.8" stroke-width="3"/>
  </g>
  <!-- dark ring + gear segments -->
  <circle cx="300" cy="305" r="152" fill="#1d1303" stroke="#5c3b06" stroke-width="7"/>
  <circle cx="300" cy="305" r="152" fill="none" stroke="#ffe9a0" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="url(#metal2)" stroke="#5c3b06" stroke-width="2" filter="url(#shine)">
    <path d="M300 158 A147 147 0 0 1 404 201 L384 221 A119 119 0 0 0 300 186 Z"/>
    <path d="M447 305 A147 147 0 0 1 404 409 L384 389 A119 119 0 0 0 419 305 Z"/>
    <path d="M300 452 A147 147 0 0 1 196 409 L216 389 A119 119 0 0 0 300 424 Z"/>
    <path d="M153 305 A147 147 0 0 1 196 201 L216 221 A119 119 0 0 0 181 305 Z"/>
  </g>
  <!-- compass star -->
  <g filter="url(#sh)"><g filter="url(#shine)">
    <path d="M300 104 L323 282 L496 305 L323 328 L300 506 L277 328 L104 305 L277 282 Z" fill="url(#metal)" stroke="#5c3b06" stroke-width="4" stroke-linejoin="round"/>
    <path d="M300 305 L412 193 L331 313 Z M300 305 L412 417 L313 331 Z M300 305 L188 417 L269 297 Z M300 305 L188 193 L287 279 Z" fill="url(#metal2)" stroke="#5c3b06" stroke-width="3" stroke-linejoin="round"/>
    <path d="M300 104 L300 506 M104 305 L496 305" stroke="#fffbe6" stroke-opacity="0.75" stroke-width="2.2"/>
  </g></g>
  <!-- orb -->
  <circle cx="300" cy="305" r="92" fill="#ffd34d" opacity="0.6" filter="url(#bloom)"/>
  <circle cx="300" cy="305" r="84" fill="url(#orb)" stroke="#6e4306" stroke-width="5" filter="url(#sh)"/>
  <circle cx="300" cy="305" r="78" fill="none" stroke="#fff3c0" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M248 262 A62 40 -20 0 1 330 238 A70 40 -20 0 0 252 280 Z" fill="#ffffff" opacity="0.65"/>
  <!-- white F -->
  <g filter="url(#sh)">
    <path d="M271 254 H342 L336 279 H299 V297 H332 L327 320 H299 V362 H271 Z" fill="#ffffff" stroke="#c48a1c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M275 258 H336 L334 266 H275 Z" fill="#fffef7"/>
  </g>
  <!-- sparkles -->
  <use href="#spark" transform="translate(262 252) scale(0.9)"/>
  <use href="#spark" transform="translate(470 150) scale(1.3)"/>
  <use href="#spark" transform="translate(130 440) scale(0.8)"/>
  <use href="#spark" transform="translate(412 196) scale(0.7)"/>
  <use href="#spark" transform="translate(300 104) scale(1.1)"/>
  <use href="#spark" transform="translate(496 305) scale(0.8)"/>
</svg>
