        --ground: #000;
        --ink: #ffffff;
        --font-display: "Inter", sans-serif;

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
      }
    </style>
