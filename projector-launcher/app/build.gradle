plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'de.beamerhome.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'de.beamerhome.launcher'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Fester Schlüssel, damit neue Versionen sich über alte installieren lassen.
    // Nur für die private Nutzung gedacht.
    signingConfigs {
        shared {
            storeFile file('../keystore/beamerhome.jks')
            storePassword 'beamerhome'
            keyAlias 'beamerhome'
            keyPassword 'beamerhome'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
