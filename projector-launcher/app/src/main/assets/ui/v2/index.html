<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beamer Home · Kino</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ambient" aria-hidden="true"><div class="amb" id="amb-a"></div><div class="amb" id="amb-b"></div></div>
<img id="art" alt="" aria-hidden="true">

<header id="top">
  <div id="clock"><div id="time"></div><div id="date"></div></div>
  <nav id="tabs"></nav>
  <div id="status"><span id="weather"></span><span id="net"></span></div>
</header>

<section id="hero">
  <div id="hero-label"></div>
  <h1 id="hero-name"></h1>
  <div id="hero-sub"></div>
</section>

<div id="row"></div>
<div id="empty" class="hidden"></div>

<div id="peek"><div id="peek-label"></div><div id="peek-icons"></div></div>

<div id="panel" class="overlay hidden"><div class="sheet"><h2 id="panel-title"></h2><div id="panel-body"></div></div></div>

<div id="toast"></div>

<script src="../mock.js"></script>
<script src="app.js"></script>
</body>
</html>
