<title>Shorts Factory Floor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D starship cutaway; mission-control HUD on top, crew roster docked right, pipeline strip bottom. Dark-only by design (deep space). */
:root {
  --bg: #04050b; --panel: rgba(9,12,24,0.84); --line: rgba(140,170,255,0.18);
  --fg: #e9eeff; --muted: #7d88a8; --accent: #5cf2ff; --hot: #ffcf4d;
  --f-display: "Chakra Petch", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-mono); overflow: hidden; }
#app { position: relative; height: 100%; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; top: 0; left: 0; right: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 12px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(4,5,11,0.96), rgba(4,5,11,0.55) 75%, rgba(4,5,11,0)); }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
.brand span { color: var(--accent); }
.job { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; }
.job label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.job input { flex: 1; min-width: 0; background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); font: 600 13px var(--f-mono); padding: 7px 10px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.clock { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
.clock div { display: flex; flex-direction: column; }
.clock small { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.clock b { font: 700 22px var(--f-display); letter-spacing: 0.04em; }
.clock .rem b { color: var(--accent); text-shadow: 0 0 14px rgba(92,242,255,0.6); }
.ctrl { display: flex; gap: 6px; }
button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 600 11px var(--f-mono); padding: 8px 11px; cursor: pointer; letter-spacing: 0.06em; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #031317; border-color: var(--accent); }
.pipe { position: absolute; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; backdrop-filter: blur(8px); max-width: calc(100% - 32px); overflow-x: auto; }
.pipe div { min-width: 92px; padding: 6px 9px; border-radius: 6px; border: 1px solid transparent; font-size: 11px; color: var(--muted); }
.pipe div b { display: block; font: 700 12px var(--f-display); letter-spacing: 0.06em; text-transform: uppercase; }
.pipe div i { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
.pipe div i::before { content: ""; display: block; height: 100%; width: var(--p, 0%); background: var(--c, var(--accent)); }
.pipe div.active { border-color: var(--c); color: var(--fg); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 35%, transparent); }
.pipe div.done { color: var(--fg); }
.crew { position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); top: 104px; width: 236px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(8px); }
.crew h2 { margin: 0 0 8px; font: 700 11px var(--f-display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.crew ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.crew li { display: grid; grid-template-columns: 12px 46px 1fr; gap: 6px; align-items: center; font-size: 11px; }
.crew li .dot { width: 10px; height: 10px; border-radius: 50%; }
.crew li .nm { font: 700 11px var(--f-display); letter-spacing: 0.06em; }
.crew li .ac { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip[hidden] { display: none; }
.chip { position: absolute; z-index: 4; transform: translate(-50%, -100%); pointer-events: none; font-size: 10px; white-space: nowrap; padding: 3px 7px;
  border-radius: 10px; background: rgba(6,8,16,0.92); border: 1px solid var(--c); color: var(--fg); white-space: normal; width: 190px; line-height: 1.4; padding: 7px 10px; }
.chip b { display: block; font: 700 12px var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.crew li { cursor: pointer; border-radius: 6px; padding: 2px 4px; }
.crew li.sel { background: rgba(255,255,255,0.07); }
#scene { cursor: grab; }
.chip::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 5px; vertical-align: 1px; }
.pop { position: absolute; z-index: 5; transform: translate(-50%, -100%); pointer-events: none; width: 170px; font-size: 10px !important; background: rgba(6,8,16,0.94); border: 1px solid var(--hot);
  border-radius: 10px; padding: 9px 11px; font-size: 11px; line-height: 1.4; box-shadow: 0 0 26px rgba(255,207,77,0.25); }
.pop b { display: block; font: 700 12px var(--f-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--hot); }
.pop .pb { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-top: 6px; overflow: hidden; }
.pop .pb i { display: block; height: 100%; width: 0; background: var(--hot); }
.room { position: absolute; z-index: 3; transform: translate(-50%, -50%); pointer-events: none; font: 700 11px var(--f-display); letter-spacing: 0.2em; text-transform: uppercase; white-space: nowrap; opacity: 0.85; }
.banner { position: absolute; z-index: 7; left: 50%; top: 40%; transform: translate(-50%, -50%); text-align: center; font: 700 clamp(24px, 5vw, 48px) var(--f-display); letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 0 30px rgba(92,242,255,0.7); }
.banner small { display: block; font: 600 12px var(--f-mono); letter-spacing: 0.14em; color: var(--accent); margin-top: 6px; }
.side { position: absolute; z-index: 6; top: 104px; width: 280px; max-height: calc(100% - 210px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(8px); }
.side h2 { margin: 0 0 8px; font: 700 11px var(--f-display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.side h2 em { font-style: normal; color: var(--accent); }
.plan { left: max(16px, env(safe-area-inset-left, 0px)); }
.plan h3 { margin: 0 0 6px; font: 700 15px var(--f-display); letter-spacing: 0.04em; }
.plan ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 11px; line-height: 1.45; color: #c9d2ee; overflow-y: auto; }
.log { right: max(16px, env(safe-area-inset-right, 0px)); }
.log ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; overflow-y: auto; min-height: 0; }
.log li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; font-size: 11px; line-height: 1.4; }
.log li time { color: var(--muted); font-variant-numeric: tabular-nums; }
.log li span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--accent)); margin-right: 6px; vertical-align: 1px; }
.log li:first-child span { color: #fff; }
.mode { font: 700 10px var(--f-mono); letter-spacing: 0.14em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.mode.live { color: #031317; background: #5cff9d; border-color: #5cff9d; }
.crew { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 1100px) { .plan { display: none; } }
@media (max-width: 760px) { .crew { display: none; } .log { top: auto; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto; max-height: 30%; } .clock b { font-size: 17px; } .pipe div { min-width: 78px; } }
</style>

<div id="app">
  <canvas id="scene" aria-label="3D starship with robot crew producing a video, room by room"></canvas>
  <header class="hud">
    <div class="brand">Shorts <span>Factory</span></div>
    <div class="job"><label for="jobName">Job</label><input id="jobName" value="Fold This Paper 42 Times" maxlength="60"></div>
    <div class="clock">
      <div><small>Elapsed</small><b id="elapsed">00:00</b></div>
      <div class="rem"><small>Remaining</small><b id="remaining">00:00</b></div>
      <div><small>Total</small><b id="total">00:00</b></div>
      <div><small>Done</small><b id="pct">0%</b></div>
    </div>
    <div class="ctrl"><button id="play" class="on" aria-pressed="true">Pause</button><button id="speed">30×</button><button id="reset">Restart</button></div>
  </header>
  <aside class="side plan" aria-label="Video plan"><h2>Plan <span class="mode" id="mode">Demo</span></h2><h3 id="planTitle">No live job yet</h3><ol id="planList"><li>Ask Claude for a new video. The plan, the log and the robots then follow the real production here.</li></ol></aside>

  <aside class="crew" aria-label="Crew"><h2>Crew · 4 bots · tap one</h2><ul id="crewList"></ul></aside>
  <nav class="pipe" id="pipe" aria-label="Pipeline"></nav>
  <div id="ov"></div>
</div>

const TOTAL = ROOMS.reduce((s, r) => s + r.min, 0) * 60;
$("total").textContent = fmt(TOTAL);
const hex = (c) => "#" + c.toString(16).padStart(6, "0");

const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.05; controls.minZoom = 0.6; controls.maxZoom = 4; controls.screenSpacePanning = true;
let viewH = 34 * SC;
function resize() { const w = canvas.clientWidth, h = canvas.clientHeight, a = w / h; viewH = a < 0.9 ? 62 * SC / a * 0.9 : 34 * SC * 0.92; camera.left = -viewH * a / 2; camera.right = viewH * a / 2; camera.top = viewH / 2; camera.bottom = -viewH / 2; camera.updateProjectionMatrix(); renderer.setSize(w, h, false); }

scene.add(new THREE.HemisphereLight(0xaab8ff, 0x0b0b1a, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-20, 40, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 40, bottom: -40, far: 200 }); sun.position.multiplyScalar(1.8); scene.add(sun);

// stars
{ const g = new THREE.BufferGeometry(), n = 1600, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { p[i * 3] = (Math.random() - 0.5) * 420; p[i * 3 + 1] = -30 - Math.random() * 60; p[i * 3 + 2] = (Math.random() - 0.5) * 320; }

{ const s = new THREE.Shape(); s.moveTo(-26, -6); s.quadraticCurveTo(-27, -12, -21, -12); s.lineTo(21, -12); s.quadraticCurveTo(29, -11, 30, 0); s.quadraticCurveTo(29, 11, 21, 12); s.lineTo(-21, 12); s.quadraticCurveTo(-27, 12, -26, 6); s.lineTo(-30, 3); s.lineTo(-30, -3); s.closePath();

  hull.rotation.x = Math.PI / 2; hull.scale.set(SC, SC, 1); hull.position.y = -0.6; hull.receiveShadow = true; scene.add(hull);

// floor textures
function tileTex(col, grid) { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
  x.fillStyle = "#11162a"; x.fillRect(0, 0, 128, 128); x.strokeStyle = hex(col) + "33"; x.lineWidth = 2; for (let i = 0; i <= 128; i += 128 / grid) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 128); x.stroke(); x.beginPath(); x.moveTo(0, i); x.lineTo(128, i); x.stroke(); }

function wall(x1, z1, x2, z2, col) {
  const len = Math.hypot(x2 - x1, z2 - z1); if (len < 0.05) return;

const roomRect = (r) => [r.cx - r.w / 2, r.cz - r.d / 2, r.cx + r.w / 2, r.cz + r.d / 2];
const corrRect = (c) => c[1] === c[3] ? [Math.min(c[0], c[2]), c[1] - CW / 2, Math.max(c[0], c[2]), c[1] + CW / 2] : [c[0] - CW / 2, Math.min(c[1], c[3]), c[0] + CW / 2, Math.max(c[1], c[3])];

function wallLine(horiz, k, a, b, rects, col) {

});
const stripMats = [];
CORR.forEach((c, i) => {
  const [x0, z0, x1, z1] = CR[i], horiz = c[1] === c[3];

    stage = st;
    ROOMS.forEach((r, i) => { const el = $("pp" + i); el.className = i < st ? "done" : i === st ? "active" : ""; el.style.setProperty("--p", i < st ? "100%" : "0%"); });
    if (finished) { banner.innerHTML = `Ready to post<small>${$("jobName").value.replace(/[<>&]/g, "")} · ${fmt(TOTAL)}</small>`; banner.hidden = false; launchT = now; }
  }
  if (!finished) $("pp" + st).style.setProperty("--p", Math.round(u * 100) + "%");
  if (L) { $("elapsed").textContent = fmt(L.elapsed); $("remaining").textContent = fmt(finished ? 0 : L.remaining); $("total").textContent = fmt(L.elapsed + (finished ? 0 : L.remaining)); $("pct").textContent = Math.floor(L.elapsed / Math.max(1, L.elapsed + (finished ? 0 : L.remaining)) * 100) + "%"; }
  else { $("elapsed").textContent = fmt(simT); $("remaining").textContent = fmt(TOTAL - simT); $("total").textContent = fmt(TOTAL); $("pct").textContent = Math.floor(simT / TOTAL * 100) + "%"; }

  // rooms + props
  ROOMS.forEach((r, i) => { const act = i === st && !finished; r.lamp.intensity = act ? 1.6 + Math.sin(now * 6) * 0.3 : i < st ? 0.7 : 0.35;
    screens[r.id].forEach((s) => { s.material.emissiveIntensity = act ? 1.2 + Math.sin(now * 9) * 0.3 : 0.5; });
    place(r.label, r.cx, 0.2, r.cz + r.d / 2 - 0.5); r.label.style.textShadow = act ? `0 0 12px ${hex(r.col)}` : "none"; });
  anims.forEach((f, i) => f(now, st === i + 1 && !finished));
  stripMats.forEach((t) => { t.offset.x = -now * 0.6; });
  scene.children.forEach((o) => { if (o.userData.flame) o.scale.y = 0.85 + Math.sin(now * 20 + o.position.z) * 0.15; });
  if (launchT > 0) { const k = Math.max(0, now - launchT - 0.8); pod.position.y = 0.15 + k * k * 3; pod.userData.flame.material.opacity = k > 0 ? 0.9 : 0; }

  // bots
  BOTS.forEach((b) => {
    if (b === carrier && !delivered && !b.path.length) { delivered = true; b.next = now + 0.8; b.status = "Handed over"; }
    if (b !== carrier || delivered) think(b, now, st, finished);
    let moving = false;
    if (b.path.length) { const [tx, tz] = b.path[0], p = b.g.position, dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz), step = b.speed * dt * (reduce ? 0.6 : 1);
      if (d <= step) { p.x = tx; p.z = tz; b.path.shift(); if (!b.path.length && !b.rooms) b.crate.visible = false; } else { p.x += dx / d * step; p.z += dz / d * step; moving = true; }
      const want = Math.atan2(dx, dz); let diff = want - b.g.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); b.g.rotation.y += diff * Math.min(1, dt * 10); }
    const working = !moving && b.rooms && b.home === ROOMS[Math.min(st, ROOMS.length - 1)].id && !finished;
    b.inner.position.y = 0.12 + Math.sin(now * 3 + b.phase) * 0.06 + (finished ? Math.abs(Math.sin(now * 6 + b.phase)) * 0.35 : 0);
    b.inner.rotation.z = moving ? Math.sin(now * 8 + b.phase) * 0.06 : 0; b.inner.rotation.x = moving ? 0.12 : 0;
    b.arms[0].rotation.x = working ? -1.2 + Math.sin(now * 16 + b.phase) * 0.4 : moving ? Math.sin(now * 8) * 0.5 : (b === carrier && !delivered) ? -1.3 : Math.sin(now * 1.5 + b.phase) * 0.1;
    b.arms[1].rotation.x = working ? -1.2 + Math.cos(now * 16 + b.phase) * 0.4 : moving ? -Math.sin(now * 8) * 0.5 : (b === carrier && !delivered) ? -1.3 : Math.cos(now * 1.5 + b.phase) * 0.1;
    if (finished) { b.arms[0].rotation.z = -2.4; b.arms[1].rotation.z = 2.4; } else { b.arms[0].rotation.z = 0; b.arms[1].rotation.z = 0; }
    const blink = (Math.sin(now * 0.9 + b.phase * 3) > 0.985) ? 0.15 : 1; b.eyes.forEach((e) => { e.scale.y = working ? 0.55 * blink : blink; });
    b.bulb.scale.setScalar(1 + (working ? Math.abs(Math.sin(now * 10)) * 0.6 : 0)); b.glow.material.opacity = moving ? 0.55 : 0.3;
    if (b === selected) { place(b.chip, b.g.position.x, 3.0, b.g.position.z); b.chip.innerHTML = `<b>${b.name}</b>${b.status || "Standing by"}<br><span style="color:var(--muted)">${b.rooms ? "Room: " + roomOf(b.home).name : "Runner"}</span>`; }
    b.row.textContent = b.status || "Standing by";
  });

  // the job: in a carrier's hands, or hovering over the active room's console
  if (carrier && !delivered) { const p = carrier.g.position, a = carrier.g.rotation.y; job.position.set(p.x + Math.sin(a) * 0.55, 1.1, p.z + Math.cos(a) * 0.55); job.rotation.y = a; }
  else { const r = ROOMS[Math.min(st, ROOMS.length - 1)]; job.position.set(r.cx + (finished ? 0 : -0.9), finished ? pod.position.y + 1.6 : 1.6 + Math.sin(now * 2) * 0.15, r.cz + (finished ? 0 : 0.4)); job.rotation.y = now * 1.5; }
  const jc = finished ? 0x5cf2ff : 0xffcf4d; jobMat.color.setHex(jc); jobLight.color.setHex(jc);

  // big popup over the active room
  if (!finished) { const r = ROOMS[st]; $("pT").textContent = `${r.stage} · ${fmt((1 - u) * r.min * 60)} left`; $("pL").textContent = !delivered ? `Job on its way to ${r.name}…` : r.tasks[Math.min(2, Math.floor(u * 3))]; $("pP").style.width = Math.round(u * 100) + "%"; place(pop, r.cx, 3.2, r.cz - r.d / 2 + 0.5); pop.style.opacity = "1"; }
  else pop.style.opacity = "0";

  controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
frame();
})();
</script>
